/* ============ ICON ============ */
const Icon = ({ name, className = "w-5 h-5", strokeWidth = 2 }) => {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = '';
      const iconDef = window.lucide.icons[name] || window.lucide.icons.circle;
      if (iconDef) {
        const svg = window.lucide.createElement(iconDef);
        svg.setAttribute('class', className);
        svg.setAttribute('stroke-width', strokeWidth);
        ref.current.appendChild(svg);
      }
    }
  }, [name, className, strokeWidth]);
  return <span ref={ref} className="inline-flex" />;
};

/* ============ TOAST ============ */
const ToastContext = createContext(null);
const ToastProvider = ({ children }) => {
  const [toasts, setToasts] = useState([]);
  const show = useCallback((message, type = 'info', duration = 3000) => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, message, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), duration);
  }, []);
  return (
    <ToastContext.Provider value={{ show }}>
      {children}
      <div className="fixed bottom-4 right-4 z-[100] flex flex-col gap-2">
        {toasts.map(t => (
          <div key={t.id} className={`toast px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 min-w-[240px] max-w-sm ${
            t.type === 'success' ? 'bg-emerald-500 text-white' :
            t.type === 'error' ? 'bg-red-500 text-white' :
            t.type === 'warning' ? 'bg-amber-500 text-white' : 'bg-slate-900 text-white'}`}>
            <Icon name={t.type === 'success' ? 'check-circle' : t.type === 'error' ? 'x-circle' : t.type === 'warning' ? 'alert-triangle' : 'info'} className="w-5 h-5 flex-shrink-0" />
            <span className="text-sm font-medium">{t.message}</span>
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
};
const useToast = () => useContext(ToastContext);

/* ============ AI SERVICE ============ */
const AIService = {
  generateSummary(data) {
    const { mode, yearsExperience, currentTitle, industry, strengths, achievements } = data;
    if (mode === 'experienced') {
      const strengthText = strengths.length ? ` Expertise in ${strengths.slice(0, 3).join(', ')}.` : '';
      const expText = yearsExperience ? `${yearsExperience}+ years of experience` : 'Experienced professional';
      const achText = achievements ? ` ${achievements}.` : '';
      return `${currentTitle || 'Professional'} with ${expText} in ${industry || 'their field'}.${strengthText}${achText} Proven track record of delivering impactful results and collaborating effectively with cross-functional teams.`;
    } else {
      const { education, skills, careerGoals, desiredRole } = data;
      const skillText = skills?.length ? ` Skilled in ${skills.slice(0, 3).join(', ')}.` : '';
      const goalText = careerGoals ? ` Passionate about ${careerGoals}.` : '';
      return `Motivated ${desiredRole || 'professional'} with ${education ? `education in ${education}` : 'strong foundation'}.${skillText}${goalText} Eager to contribute to a dynamic team and grow professionally while delivering high-quality results.`;
    }
  },
  improveBullet(input) {
    if (!input || input.trim().length < 5) return input;
    let improved = input.trim();
    const replacements = { 'managed': 'Directed', 'did': 'Executed', 'made': 'Developed', 'worked on': 'Contributed to', 'helped': 'Facilitated', 'was responsible for': 'Spearheaded', 'handled': 'Oversaw', 'took care of': 'Managed' };
    Object.entries(replacements).forEach(([weak, strong]) => {
      if (improved.toLowerCase().startsWith(weak)) improved = strong + improved.substring(weak.length);
    });
    improved = improved.charAt(0).toUpperCase() + improved.slice(1);
    if (improved.split(' ').length < 6) improved = improved.replace(/\.$/, '') + ' while ensuring high-quality deliverables and stakeholder satisfaction.';
    if (!improved.endsWith('.')) improved += '.';
    return improved;
  },
  suggestSkills(jobTitle, existingSkills = []) {
    const skillMap = {
      'software': ['JavaScript', 'TypeScript', 'Python', 'React', 'Node.js', 'SQL', 'Git', 'AWS', 'Docker', 'System Design'],
      'web developer': ['HTML', 'CSS', 'JavaScript', 'React', 'Vue', 'Node.js', 'REST APIs', 'Git', 'Responsive Design'],
      'frontend': ['HTML', 'CSS', 'JavaScript', 'React', 'Vue', 'TypeScript', 'Responsive Design', 'UI/UX', 'Webpack'],
      'backend': ['Python', 'Java', 'Node.js', 'SQL', 'PostgreSQL', 'MongoDB', 'REST APIs', 'GraphQL', 'Docker'],
      'data': ['Python', 'R', 'SQL', 'Machine Learning', 'TensorFlow', 'Pandas', 'NumPy', 'Statistics'],
      'ai': ['Python', 'Machine Learning', 'Prompt Engineering', 'ChatGPT', 'Data Analysis', 'TensorFlow', 'Computer Vision', 'NLP'],
      'product': ['Product Strategy', 'Agile', 'User Research', 'Data Analysis', 'Roadmapping', 'JIRA'],
      'designer': ['Figma', 'Adobe XD', 'UI Design', 'UX Research', 'Prototyping', 'Design Systems'],
      'marketing': ['SEO', 'Content Marketing', 'Social Media', 'Google Analytics', 'Email Marketing', 'Copywriting'],
      'sales': ['CRM', 'Negotiation', 'Lead Generation', 'Salesforce', 'Account Management'],
      'teacher': ['Curriculum Development', 'Classroom Management', 'Educational Technology', 'Assessment']
    };
    const key = jobTitle.toLowerCase();
    let suggestions = [];
    Object.entries(skillMap).forEach(([k, v]) => { if (key.includes(k)) suggestions = v; });
    if (suggestions.length === 0) suggestions = ['Communication', 'Problem Solving', 'Teamwork', 'Time Management', 'Critical Thinking', 'Leadership'];
    return suggestions.filter(s => !existingSkills.includes(s));
  },
  analyzeATS(resume, jobDescription = '') {
    let total = 0; const breakdown = {};
    const contactScore = (resume.personal.firstName ? 5 : 0) + (resume.personal.lastName ? 5 : 0) + (resume.personal.email ? 5 : 0) + (resume.personal.phone ? 5 : 0);
    breakdown.contact = { score: contactScore, max: 20 }; total += contactScore;
    const summaryScore = resume.summary.text.length > 50 ? 15 : resume.summary.text.length > 20 ? 10 : 5;
    breakdown.summary = { score: summaryScore, max: 15 }; total += summaryScore;
    const expScore = Math.min(25, resume.experiences.length * 8 + (resume.experiences.some(e => e.bullets.length >= 3) ? 5 : 0));
    breakdown.experience = { score: expScore, max: 25 }; total += expScore;
    const skillScore = Math.min(15, (resume.skills.technical.length + resume.skills.soft.length) * 2);
    breakdown.skills = { score: skillScore, max: 15 }; total += skillScore;
    const eduScore = resume.education.length > 0 ? 10 : 0;
    breakdown.education = { score: eduScore, max: 10 }; total += eduScore;
    let keywordScore = 5;
    if (jobDescription) {
      const keywords = jobDescription.toLowerCase().match(/\b\w+\b/g) || [];
      const resumeText = JSON.stringify(resume).toLowerCase();
      const matches = keywords.filter(w => w.length > 4 && resumeText.includes(w)).length;
      keywordScore = Math.min(10, Math.floor((matches / Math.max(20, keywords.length)) * 20));
    }
    breakdown.keywords = { score: keywordScore, max: 10 }; total += keywordScore;
    breakdown.formatting = { score: 5, max: 5 }; total += 5;
    return { total, rating: total >= 85 ? 'Excellent' : total >= 70 ? 'Good' : total >= 50 ? 'Fair' : 'Needs Improvement', breakdown };
  },
  generateRecommendations(resume) {
    const recs = [];
    if (!resume.personal.email) recs.push({ type: 'warning', text: 'Professional email add karein' });
    if (!resume.personal.phone) recs.push({ type: 'warning', text: 'Phone number add karein taake recruiters call kar saken' });
    if (!resume.summary.text) recs.push({ type: 'info', text: 'Professional summary likhein - ye pehla impression banata hai' });
    if (resume.experiences.length === 0) recs.push({ type: 'info', text: 'Work experience add karein (ya projects/internships)' });
    if (resume.experiences.some(e => e.bullets.length < 3)) recs.push({ type: 'tip', text: 'Har job ke liye 3-5 bullet points likhein' });
    if (resume.skills.technical.length < 5) recs.push({ type: 'tip', text: 'Kam az kam 5 technical skills add karein' });
    if (resume.education.length === 0) recs.push({ type: 'info', text: 'Education add karein' });
    const hasNumbers = resume.experiences.some(e => e.bullets.some(b => /\d+/.test(b)));
    if (!hasNumbers && resume.experiences.length > 0) recs.push({ type: 'tip', text: 'Numbers add karein jese "20% sales barhayi" ya "8 logon ki team lead ki"' });
    return recs;
  },
  extractKeywords(jobDescription) {
    if (!jobDescription) return [];
    const stopWords = new Set(['the', 'and', 'or', 'but', 'is', 'are', 'was', 'were', 'be', 'been', 'being', 'have', 'has', 'had', 'do', 'does', 'did', 'will', 'would', 'could', 'should', 'may', 'might', 'must', 'shall', 'can', 'for', 'with', 'about', 'from', 'into', 'through', 'during', 'before', 'after', 'above', 'below', 'to', 'of', 'in', 'on', 'at', 'by', 'as', 'if', 'then', 'than', 'so', 'that', 'this', 'these', 'those', 'it', 'its', 'we', 'our', 'you', 'your', 'they', 'their', 'a', 'an', 'not', 'no', 'who', 'whom', 'which', 'what', 'when', 'where', 'why', 'how', 'all', 'each', 'every', 'both', 'few', 'more', 'most', 'other', 'some', 'such', 'only', 'own', 'same', 'just', 'also', 'very']);
    const words = jobDescription.toLowerCase().match(/\b[a-z]+\b/g) || [];
    const freq = {};
    words.forEach(w => { if (w.length > 3 && !stopWords.has(w)) freq[w] = (freq[w] || 0) + 1; });
    return Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 20).map(([word]) => word);
  }
};

  return (
    <button type={type} onClick={onClick} disabled={disabled || loading}

  const helpInfo = helpKey ? HELP[helpKey] : null;
  const Component = multiline ? 'textarea' : 'input';
  return (
    <div className="space-y-1">
      {label && <label htmlFor={id} className="block text-sm font-medium text-slate-700">{label}{(required || helpInfo?.required) && <span className="text-red-500 ml-0.5">*</span>}</label>}

        <Component id={id} type={type} value={value} onChange={(e) => onChange(e.target.value)}
          placeholder={placeholder || helpInfo?.example} disabled={disabled} rows={multiline ? rows : undefined}
          className={`input-field ${icon ? 'pl-10' : ''} ${error ? 'error' : ''} ${multiline ? 'resize-none' : ''}`} />
      </div>
      {error && <p className="text-xs text-red-500 flex items-center gap-1"><Icon name="alert-circle" className="w-3 h-3" />{error}</p>}
      {help && !error && <p className="text-xs text-slate-500">{help}</p>}
      {helpKey && <FieldHelp helpKey={helpKey} />}
    </div>
  );
};

const Select = ({ label, value, onChange, options, placeholder, error, helpKey, required, disabled, searchable }) => {
  const id = useMemo(() => `select_${Math.random().toString(36).substr(2, 9)}`, []);
  const [open, setOpen] = useState(false);
  const [search, setSearch] = useState('');
  const ref = useRef(null);
  useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);
  const filtered = (options || []).filter(o => (typeof o === 'string' ? o : o.label).toLowerCase().includes(search.toLowerCase()));
  const selectedLabel = value ? ((options || []).find(o => (typeof o === 'string' ? o : o.value) === value) ? value : (options || []).find(o => o.value === value)?.label || value) : placeholder;

  if (searchable && options && options.length > 8) {
    return (
      <div className="space-y-1" ref={ref}>
        {label && <label className="block text-sm font-medium text-slate-700">{label} {required && <span className="text-red-500 ml-0.5">*</span>}</label>}
        <div className="relative">
          <button type="button" onClick={() => setOpen(!open)} className={`input-field text-left flex items-center justify-between ${error ? 'error' : ''}`}>
            <span className={value ? 'text-slate-900' : 'text-slate-400'}>{selectedLabel}</span>
            <Icon name="chevron-down" className={`w-4 h-4 text-slate-400 transition-transform ${open ? 'rotate-180' : ''}`} />
          </button>
          {open && (
            <div className="absolute z-20 mt-1 w-full bg-white border border-slate-200 rounded-xl shadow-lg max-h-64 overflow-hidden animate-slide-down">
              <div className="p-2 border-b border-slate-100">
                <input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="🔍 Search..." autoFocus
                  className="w-full px-3 py-2 text-sm rounded-lg border border-slate-200 focus:border-indigo-500 focus:outline-none" />
              </div>
              <div className="max-h-48 overflow-y-auto">
                {filtered.length === 0 ? <div className="p-4 text-center text-sm text-slate-500">Kuch nahi mila</div> :
                  filtered.map(opt => {
                    const val = typeof opt === 'string' ? opt : opt.value;
                    const lab = typeof opt === 'string' ? opt : opt.label;
                    return (
                      <button key={val} type="button" onClick={() => { onChange(val); setOpen(false); setSearch(''); }}
                        className={`w-full text-left px-3 py-2 text-sm hover:bg-indigo-50 transition-colors ${value === val ? 'bg-indigo-50 text-indigo-700 font-medium' : 'text-slate-700'}`}>
                        {lab}
                      </button>
                    );
                  })}
              </div>
            </div>
          )}
        </div>
        {helpKey && <FieldHelp helpKey={helpKey} />}
      </div>
    );
  }
  return (
    <div className="space-y-1">
      {label && <label htmlFor={id} className="block text-sm font-medium text-slate-700">{label} {required && <span className="text-red-500 ml-0.5">*</span>}</label>}
      <div className="relative">
        <select id={id} value={value} onChange={(e) => onChange(e.target.value)} disabled={disabled} className={`input-field appearance-none pr-10 ${error ? 'error' : ''}`}>
          {placeholder && <option value="">{placeholder}</option>}
          {(options || []).map(opt => { const val = typeof opt === 'string' ? opt : opt.value; const lab = typeof opt === 'string' ? opt : opt.label; return <option key={val} value={val}>{lab}</option>; })}
        </select>
        <Icon name="chevron-down" className="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none" />
      </div>
      {helpKey && <FieldHelp helpKey={helpKey} />}
    </div>
  );
};

const TagInput = ({ value = [], onChange, suggestions = [], placeholder, label, helpKey }) => {
  const [input, setInput] = useState('');
  const [showSugg, setShowSugg] = useState(false);
  const addTag = (tag) => { const t = tag.trim(); if (t && !value.includes(t)) onChange([...value, t]); setInput(''); setShowSugg(false); };
  const removeTag = (tag) => onChange(value.filter(v => v !== tag));
  const filteredSugg = suggestions.filter(s => s.toLowerCase().includes(input.toLowerCase()) && !value.includes(s));
  return (
    <div className="space-y-1">
      {label && <label className="block text-sm font-medium text-slate-700">{label}</label>}
      <div className="relative">
        <div className="input-field flex flex-wrap gap-1.5 py-2 min-h-[44px]">
          {value.map(tag => (
            <span key={tag} className="tag">{tag}
              <button type="button" onClick={() => removeTag(tag)} className="hover:text-red-600"><Icon name="x" className="w-3 h-3" /></button>
            </span>
          ))}
          <input type="text" value={input} onChange={(e) => { setInput(e.target.value); setShowSugg(true); }}
            onFocus={() => setShowSugg(true)} onBlur={() => setTimeout(() => setShowSugg(false), 200)}
            onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addTag(input); } else if (e.key === 'Backspace' && !input && value.length) removeTag(value[value.length - 1]); }}
            placeholder={value.length === 0 ? placeholder : ''} className="flex-1 min-w-[100px] outline-none text-sm" />
        </div>
        {showSugg && input && filteredSugg.length > 0 && (
          <div className="absolute z-10 mt-1 w-full bg-white border border-slate-200 rounded-xl shadow-lg max-h-48 overflow-y-auto">
            {filteredSugg.slice(0, 8).map(s => (
              <button key={s} type="button" onMouseDown={() => addTag(s)} className="w-full text-left px-3 py-2 text-sm hover:bg-indigo-50 transition-colors">{s}</button>
            ))}
          </div>
        )}
      </div>
      {helpKey && <FieldHelp helpKey={helpKey} />}
    </div>
  );
};

        )}
      </Card>
    </div>
  );
};

const ATSCheckStep = ({ resume }) => {

  const ringColor = score.total >= 85 ? '#10b981' : score.total >= 70 ? '#3b82f6' : score.total >= 50 ? '#f59e0b' : '#ef4444';
  return (
    <div className="space-y-6">

            <svg className="w-40 h-40 transform -rotate-90">
              <circle cx="80" cy="80" r="70" stroke="#e2e8f0" strokeWidth="12" fill="none" />
              <circle cx="80" cy="80" r="70" stroke={ringColor} strokeWidth="12" fill="none" strokeDasharray={`${(score.total / 100) * 440} 440`} strokeLinecap="round" />

            <div className="absolute inset-0 flex flex-col items-center justify-center">
              <div className={`text-4xl font-bold ${scoreColor}`}>{score.total}</div>

            </div>
          </div>
          <div className="flex-1 text-center md:text-left">
            <h2 className="text-2xl font-bold text-slate-900 mb-1">
              {score.total >= 85 ? '🎉 Zabardast Resume!' : score.total >= 70 ? '👍 Acha Resume' : score.total >= 50 ? '📝 Theek Hai' : '⚠️ Zaroorat Hai Behtari Ki'}
            </h2>
            <p className="text-slate-600 mb-4">{score.rating}. {score.total >= 70 ? 'ATS ke liye ready hai!' : 'Kuch improvements se aur acha ho sakta hai'}.</p>
            <div className="grid grid-cols-2 gap-2 text-sm">
              <div className="flex items-center gap-2"><Icon name="check" className="w-4 h-4 text-emerald-500" />ATS Compatible</div>
              <div className="flex items-center gap-2"><Icon name="check" className="w-4 h-4 text-emerald-500" />Professional Format</div>
              <div className="flex items-center gap-2"><Icon name="check" className="w-4 h-4 text-emerald-500" />Readability: Excellent</div>
              <div className="flex items-center gap-2"><Icon name="check" className="w-4 h-4 text-emerald-500" />Complete Sections</div>
            </div>
          </div>
        </div>
      </Card>
      <Card>
        <h3 className="font-semibold text-slate-900 mb-3 flex items-center gap-2"><Icon name="bar-chart" className="w-5 h-5 text-indigo-500" />Score Breakdown</h3>
        <div className="space-y-3">
          {Object.entries(score.breakdown).map(([key, val]) => {
            const pct = (val.score / val.max) * 100;
            return (
              <div key={key}>
                <div className="flex justify-between text-sm mb-1">
                  <span className="font-medium capitalize text-slate-700">{key}</span>
                  <span className="text-slate-500">{val.score}/{val.max}</span>
                </div>
                <div className="progress-bar"><div className="progress-fill" style={{ width: `${pct}%`, background: pct >= 70 ? '#10b981' : pct >= 50 ? '#f59e0b' : '#ef4444' }} /></div>
              </div>
            );
          })}
        </div>
      </Card>
      {recommendations.length > 0 && (
        <Card>
          <h3 className="font-semibold text-slate-900 mb-3 flex items-center gap-2"><Icon name="lightbulb" className="w-5 h-5 text-amber-500" />Recommendations / Mashware</h3>
          <div className="space-y-2">
            {recommendations.map((rec, i) => (
              <div key={i} className={`flex items-start gap-3 p-3 rounded-xl ${rec.type === 'warning' ? 'bg-red-50 border border-red-100' : rec.type === 'tip' ? 'bg-amber-50 border border-amber-100' : 'bg-blue-50 border border-blue-100'}`}>
                <Icon name={rec.type === 'warning' ? 'alert-circle' : rec.type === 'tip' ? 'lightbulb' : 'info'} className={`w-5 h-5 flex-shrink-0 mt-0.5 ${rec.type === 'warning' ? 'text-red-500' : rec.type === 'tip' ? 'text-amber-500' : 'text-blue-500'}`} />
                <span className="text-sm text-slate-700">{rec.text}</span>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
};

/* =========================================================
   RESUME PREVIEW — FIXED AUTO-FILL ENGINE (v2)
   Bug fix: ab reset sirf content-signature change par hota hai,
   har render par nahi. Is liye scaling cancel nahi hoti.
   ========================================================= */
const ResumePreview = ({ resume, templateId, design }) => {
  const template = TEMPLATES.find(t => t.id === templateId) || TEMPLATES[0];
  const effectiveDesign = {
    primaryColor: design?.primaryColor || template.defaultPrimary,
    accentColor: design?.accentColor || template.defaultAccent,
    font: design?.font || template.font,
    fontClass: design?.fontClass || template.fontClass,
    layout: design?.layout || template.layout,
    fitMode: design?.fitMode || 'auto',
    background: design?.background || { enabled: false, url: '', opacity: 0.1 }
  };
  const fitMode = effectiveDesign.fitMode;
  const bg = effectiveDesign.background;
  const p = effectiveDesign.primaryColor;
  const a = effectiveDesign.accentColor;
  const fullName = `${resume.personal.firstName || ''} ${resume.personal.middleName || ''} ${resume.personal.lastName || ''}`.trim() || 'Your Name';
  const c = resume.personal;

  /* ---- AUTO-FILL STATE ---- */
  const [mult, setMult] = useState(fitMode === 'large' ? 1.22 : 1);
  const measureRef = useRef(null);
  const innerRef = useRef(null);
  const passRef = useRef(0);
  const sigRef = useRef('');

  const sig = useMemo(() => JSON.stringify([
    resume.personal, resume.summary, resume.experiences, resume.education,
    resume.skills, resume.projects, resume.certifications, resume.additional,
    resume.sections, effectiveDesign.layout, fitMode
  ]), [resume, effectiveDesign.layout, fitMode]);

  useLayoutEffect(() => {
    if (fitMode === 'large') { if (mult !== 1.22) setMult(1.22); return; }
    if (fitMode === 'normal') { if (mult !== 1) setMult(1); return; }
    /* auto mode */
    if (sigRef.current !== sig) { sigRef.current = sig; passRef.current = 0; }
    if (passRef.current === 0) {
      const el = measureRef.current;
      if (!el) return;
      const H = el.offsetHeight;
      if (!H || H >= PAGE_H * 0.99) { passRef.current = 99; if (mult !== 1) setMult(1); return; }
      const m = Math.min(1.6, Math.sqrt(PAGE_H / H));
      passRef.current = 1;
      if (m > 1.02) setMult(m); else { if (mult !== 1) setMult(1); passRef.current = 99; }
    } else if (passRef.current === 1) {
      const el = innerRef.current;
      if (!el) { passRef.current = 99; return; }
      const H2 = el.offsetHeight;
      passRef.current = 99;
      const visual = H2 * mult;
      if (H2 && visual < PAGE_H * 0.985) {
        const m2 = Math.min(1.6, Math.sqrt((PAGE_H * mult) / H2));
        if (m2 > mult + 0.02) setMult(m2);
      }
    }
  });

  const renderContactInline = () => (
    <div className="flex flex-wrap items-center justify-center gap-x-3 gap-y-1" style={{ fontSize: '0.7rem' }}>
      {c.email && <span>✉ {c.email}</span>}
      {c.phone && <span>☎ {c.phone}</span>}
      {c.city && <span>📍 {c.city}{c.country ? `, ${c.country}` : ''}</span>}
      {c.linkedin && <span>in {c.linkedin}</span>}
      {c.github && <span>⌘ {c.github}</span>}
    </div>
  );

  const renderSectionTitle = (title, style = 'underline') => {
    if (style === 'underline') return <h3 className="text-xs font-bold uppercase tracking-widest pb-1 mb-2 border-b-2" style={{ color: p, borderColor: a }}>{title}</h3>;
    if (style === 'bg') return <h3 className="text-xs font-bold uppercase tracking-widest px-3 py-1 mb-2 text-white" style={{ backgroundColor: a }}>{title}</h3>;
    if (style === 'line-left') return <h3 className="text-xs font-bold uppercase tracking-widest pl-3 mb-2 border-l-4" style={{ color: p, borderColor: a }}>{title}</h3>;
    if (style === 'italic') return <h3 className="text-sm font-semibold italic mb-2" style={{ color: a }}>{title}</h3>;
    if (style === 'big') return <h3 className="text-lg font-extrabold uppercase tracking-wider mb-3 pb-1 border-b-4" style={{ color: p, borderColor: a }}>{title}</h3>;
    return <h3 className="text-xs font-bold uppercase tracking-widest mb-2" style={{ color: p }}>{title}</h3>;
  };

  const renderExperience = () => resume.experiences.map(exp => (
    <div key={exp.id} className="mb-3">
      <div className="flex justify-between items-baseline mb-0.5">
        <div>

        <div className="text-xs text-right whitespace-nowrap" style={{ color: p }}>{exp.startMonth && `${exp.startMonth} `}{exp.startYear} — {exp.current ? 'Present' : `${exp.endMonth || ''} ${exp.endYear}`}</div>

    </div>

  const renderAwards = () => (resume.additional.awards || []).map(award => (

  const renderInterests = () => (resume.additional.interests || []).length > 0 && (

  const layouts = {

        <div className="text-center mb-6 pb-4 border-b-2" style={{ borderColor: a }}>

/* ============ AUTO-SCALED RESUME ============ */
const AutoScaledResume = ({ resume, templateId, design, className = '' }) => {
  const ref = useRef(null);
  const [scale, setScale] = useState(0.25);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const update = () => { const w = el.clientWidth; if (w > 0) setScale(w / PAGE_W); };
    update();
    const ro = new ResizeObserver(update);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  return (
    <div ref={ref} className={className} style={{ width: '100%', height: PAGE_H * scale, overflow: 'hidden', position: 'relative' }}>
      <div style={{ width: PAGE_W, minHeight: PAGE_H, transform: `scale(${scale})`, transformOrigin: 'top left' }}>
        <ResumePreview resume={resume} templateId={templateId} design={design} />
      </div>
    </div>
  );
};

/* ============ BACKGROUND STUDIO ============ */
const BackgroundStudio = ({ design, onChange }) => {
  const toast = useToast();
  const bg = design.background || { enabled: false, url: '', opacity: 0.1 };
  const [idea, setIdea] = useState('');
  const [style, setStyle] = useState('Elegant');
  const [generating, setGenerating] = useState(false);

  const applyUrl = (url) => onChange({ ...design, background: { ...bg, enabled: true, url } });

  const generate = (promptIdea) => {
    const finalIdea = promptIdea || idea;
    if (!finalIdea.trim()) { toast.show('Pehle apna idea likhein ya preset chunein', 'warning'); return; }
    setGenerating(true);
    const url = buildBgUrl(finalIdea, style);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { setGenerating(false); applyUrl(url); toast.show('AI background ready ho gaya! 🎨', 'success'); };
    img.onerror = () => { setGenerating(false); toast.show('Background load nahi ho saka, dobara try karein', 'error'); };
    img.src = url;
  };

  return (
    <div className="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">
      <div>
        <h3 className="font-semibold text-slate-900 mb-1 flex items-center gap-2"><Icon name="image" className="w-5 h-5 text-pink-500" />AI Background Studio</h3>
        <p className="text-xs text-slate-500 italic">Roses, phool, mountain, water - jo chahein background banayein</p>
      </div>
      <label className="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" checked={bg.enabled} onChange={(e) => onChange({ ...design, background: { ...bg, enabled: e.target.checked } })} className="w-4 h-4 rounded accent-indigo-600" />
        <span className="text-sm font-medium">Background ON karein</span>
      </label>
      <div>
        <label className="text-xs text-slate-600 mb-2 block">Ready-made Presets</label>
        <div className="grid grid-cols-4 gap-2">
          {BG_PRESETS.map(p => (
            <button key={p.name} onClick={() => { setIdea(p.idea); generate(p.idea); }}
              className="p-2 rounded-xl border-2 border-slate-200 hover:border-pink-400 text-center transition-colors">
              <div className="text-xl">{p.emoji}</div>
              <div className="text-[10px] font-medium mt-1 leading-tight">{p.name}</div>
            </button>
          ))}
        </div>
      </div>
      <div className="border-t border-slate-200 pt-3">
        <label className="text-xs text-slate-600 mb-1 block">Apna Idea Likhein (Edit karein)</label>
        <textarea value={idea} onChange={(e) => setIdea(e.target.value)} rows={2}
          placeholder="e.g. soft pink roses with golden light, ya blue ocean waves..."
          className="input-field resize-none text-sm" />
        <div className="flex gap-2 mt-2">
          <select value={style} onChange={(e) => setStyle(e.target.value)} className="input-field text-sm">
            {Object.keys(BG_STYLES).map(s => <option key={s} value={s}>{s}</option>)}
          </select>
          <Button variant="ai" size="sm" onClick={() => generate()} loading={generating} icon="sparkles">Generate</Button>
        </div>
        <p className="text-[11px] text-slate-500 italic mt-1">Pehle idea likhein, edit karein, phir Generate dabayein - AI aapke idea se background banayega</p>
      </div>
      {bg.enabled && bg.url && (
        <div className="border-t border-slate-200 pt-3">
          <div className="flex items-center justify-between mb-2">
            <label className="text-xs text-slate-600">Opacity / Shaffafi: {Math.round((bg.opacity ?? 0.1) * 100)}%</label>
            <button onClick={() => onChange({ ...design, background: { enabled: false, url: '', opacity: 0.1 } })} className="text-xs text-red-500 font-medium">Remove</button>
          </div>
          <input type="range" min="0.03" max="0.4" step="0.01" value={bg.opacity ?? 0.1}
            onChange={(e) => onChange({ ...design, background: { ...bg, opacity: parseFloat(e.target.value) } })}

/* ============ SECTION REORDER ============ */
const SectionReorder = ({ sections, onChange }) => {
  const [dragged, setDragged] = useState(null);
  const [over, setOver] = useState(null);
  const sectionLabels = {
    summary: { icon: 'file-text', label: 'Summary', urdu: 'Khulasa' },
    experience: { icon: 'briefcase', label: 'Experience', urdu: 'Tajurba' },
    education: { icon: 'graduation-cap', label: 'Education', urdu: 'Taleem' },
    skills: { icon: 'award', label: 'Skills', urdu: 'Maharatein' },
    projects: { icon: 'folder', label: 'Projects', urdu: 'Projects' },
    certifications: { icon: 'award', label: 'Certifications', urdu: 'Certificates' },
    awards: { icon: 'trophy', label: 'Awards', urdu: 'Awards' },
  };
  const onDrop = (e, index) => {
    e.preventDefault();
    if (dragged === null || dragged === index) return;
    const updated = [...sections];
    const [moved] = updated.splice(dragged, 1);
    updated.splice(index, 0, moved);
    onChange(updated);
    setDragged(null); setOver(null);
  };
  const removeSection = (section) => { if (confirm(`Kya aap ${sectionLabels[section]?.label || section} ko hatana chahte hain?`)) onChange(sections.filter(s => s !== section)); };
  const addSection = (section) => { if (!sections.includes(section)) onChange([...sections, section]); };
  const availableToAdd = Object.keys(sectionLabels).filter(s => !sections.includes(s));
  return (
    <div className="bg-white rounded-2xl border border-slate-200 p-5">
      <h3 className="font-semibold text-slate-900 mb-1 flex items-center gap-2"><Icon name="grip-vertical" className="w-5 h-5 text-indigo-500" />Section Order</h3>
      <p className="text-xs text-slate-500 italic mb-3">Sections ko drag karke reorder karein</p>
      <div className="space-y-2">
        {sections.map((section, i) => (
          <div key={section} draggable
            onDragStart={() => setDragged(i)}
            onDragOver={(e) => { e.preventDefault(); setOver(i); }}
            onDrop={(e) => onDrop(e, i)}
            className={`flex items-center gap-3 p-3 bg-slate-50 border border-slate-200 rounded-xl cursor-move ${dragged === i ? 'opacity-50' : ''} ${over === i ? 'border-indigo-500 bg-indigo-50' : ''} transition-colors`}>
            <Icon name="grip-vertical" className="w-4 h-4 text-slate-400" />
            <Icon name={sectionLabels[section]?.icon || 'circle'} className="w-4 h-4 text-indigo-500" />
            <div className="flex-1">
              <span className="text-sm font-medium">{sectionLabels[section]?.label || section}</span>
              <span className="text-xs text-slate-400 ml-2 italic">({sectionLabels[section]?.urdu})</span>
            </div>
            <button onClick={() => removeSection(section)} className="text-red-500 hover:bg-red-50 p-1 rounded"><Icon name="x" className="w-4 h-4" /></button>
          </div>
        ))}
      </div>
      {availableToAdd.length > 0 && (
        <div className="mt-4 pt-4 border-t border-slate-200">
          <p className="text-xs text-slate-500 mb-2 italic">Aur sections add karein:</p>
          <div className="flex flex-wrap gap-2">
            {availableToAdd.map(s => (
              <button key={s} onClick={() => addSection(s)} className="text-xs px-2 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg">+ {sectionLabels[s]?.label || s}</button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
};

/* ============ AI ASSISTANT ============ */
const AIAssistant = () => {
  const [open, setOpen] = useState(false);
  const [messages, setMessages] = useState([{ role: 'assistant', text: "Assalam o Alaikum! 👋 Main aapka resume assistant hoon. Resume ke baare mein kuch bhi poochein!" }]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const getResponse = (question) => {
    const q = question.toLowerCase();
    if (q.includes('summary') || q.includes('about') || q.includes('khulasa')) return "Summary 2-4 lines mein likhein. Isme apna role, experience ke saal, top skills aur ek achievement shamil karein. Example: 'AI trainee at Bano Qabil with hands-on practice in prompt engineering and Python.'";
    if (q.includes('bullet') || q.includes('achievement') || q.includes('responsibility')) return "Bullet points mein strong action verbs use karein: Led, Developed, Increased, Managed. Numbers add karein: '20% sales barhayi' ya '8 logon ki team lead ki'. Focus achievements pe karein, sirf duties nahi.";
    if (q.includes('skill') || q.includes('maharat')) return "8-12 skills add karein - technical aur soft dono. Job description se keywords match karein. Sirf wo likhein jo aapko waqai aati hain, interview mein poochha ja sakta hai!";
    if (q.includes('experience') || q.includes('tajurba') || q.includes('no experience') || q.includes('student')) return "Experience nahi? Koi masla nahi! Education, projects, volunteer work, aur transferable skills pe focus karein. Aapka Bano Qabil AI course aur course projects bohat important hain.";
    if (q.includes('photo') || q.includes('tasveer')) return "Photo optional hai. Pakistan, Gulf countries mein common hai. US/UK/Canada mein avoid karein kyun ke ATS systems usay parse nahi kar paate. Agar lagayein to professional photo ho.";
    if (q.includes('template') || q.includes('design')) return "Template aise chunein jo aapki industry ke hisaab se ho. Students/trainees ke liye 'Student Fresh' template best hai. Corporate roles ke liye Classic ya Minimal. Baad mein colors aur fonts customize kar sakte hain!";
    if (q.includes('ats')) return "ATS beat karne ke liye: standard section headings use karein (Experience, Education), job description se keywords add karein, graphics heavy designs avoid karein, simple formatting use karein. Humare ATS-Friendly template best hai!";
    if (q.includes('background') || q.includes('phool') || q.includes('roses')) return "AI Background Studio use karein! Templates section mein 'AI Background Studio' mein roses, phool, mountain, water jaise presets hain. Ya apna idea likh kar Generate karein. Opacity kam rakhein taake text readable rahe.";
    if (q.includes('course') || q.includes('bano qabil')) return "Aapka Bano Qabil AI course aapki sab se bari strength hai! Isay Education aur Certification dono mein likhein, aur course projects ko Projects section mein dikhayein. Is se recruiters ko pata chalta hai ke aap active learning kar rahe hain.";
    if (q.includes('section') || q.includes('hissa')) return "Zaroori sections: Contact Info, Summary, Education, Skills. Optional: Projects, Certifications, Awards, Languages. Students ke liye Education aur Projects sab se important hain.";
    if (q.includes('internship')) return "Internship ko regular job ki tarah describe karein: title, company, dates, achievements. Kya seekha, kya contribute kiya, results kya mile - ye sab mention karein.";
    if (q.includes('length') || q.includes('page') || q.includes('size') || q.includes('khali')) return "Page Fit 'Auto' mode mein rakhein - ye content ko measure karke fonts/spacing khud adjust kar deta hai taake page kabhi khali na lage. Students ke liye 1 page perfect hai.";
    if (q.includes('email') || q.includes('contact')) return "Professional email use karein: firstname.lastname@gmail.com. Nickname ya funny email mat likhein. Phone number country code ke saath, city/state, aur LinkedIn URL add karein.";
    if (q.includes('fresh') || q.includes('graduate') || q.includes('new')) return "Fresh students ke liye: Education sab se pehle, course projects detail mein, coursework relevant likhein, skills highlight karein. Aapka AI course aapko doosron se alag karta hai!";
    if (q.includes('help') || q.includes('madad') || q.includes('start')) return "Main aapki madad ke liye hoon! Pooch sakte hain: summary kaise likhein, bullet points, skills, experience, templates, ATS, background, ya resume ka koi bhi masla.";
    return "Acha sawal hai! Mujhse pooch sakte hain: summary, bullet points, skills, experience, templates, ATS, backgrounds, ya resume ka koi bhi pehlu.";
  };
  const send = async () => {
    if (!input.trim()) return;
    const userMsg = { role: 'user', text: input };
    setMessages(m => [...m, userMsg]);
    setInput('');
    setLoading(true);
    await new Promise(r => setTimeout(r, 600));
    setMessages(m => [...m, { role: 'assistant', text: getResponse(input) }]);
    setLoading(false);
  };
  const quickQuestions = ['Summary kaise likhein?', 'Skills kya add karun?', 'Experience nahi hai', 'ATS ke liye tips', 'Background kaise lagayein?', 'Page khali hai'];
  return (
    <>
      <button onClick={() => setOpen(!open)} className="fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full bg-gradient-to-br from-purple-500 via-pink-500 to-orange-400 text-white shadow-xl hover:shadow-2xl hover:scale-110 transition-all flex items-center justify-center" title="Resume Assistant - Madad">
        <Icon name={open ? 'x' : 'sparkles'} className="w-6 h-6" />
      </button>
      {open && (
        <div className="fixed bottom-24 right-6 z-40 w-80 md:w-96 bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden animate-scale-in">
          <div className="bg-gradient-to-br from-purple-500 via-pink-500 to-orange-400 p-4 text-white">
            <div className="flex items-center gap-2"><Icon name="sparkles" className="w-5 h-5" /><h3 className="font-bold">Resume Assistant</h3></div>
            <p className="text-xs opacity-90 mt-1">Aapka apna resume madadgaar 🤖</p>
          </div>
          <div className="h-80 overflow-y-auto p-4 space-y-3 bg-slate-50">
            {messages.map((msg, i) => (
              <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[85%] p-3 rounded-2xl text-sm ${msg.role === 'user' ? 'bg-indigo-600 text-white rounded-br-sm' : 'bg-white border border-slate-200 rounded-bl-sm'}`}>{msg.text}</div>
              </div>
            ))}
            {loading && (
              <div className="flex justify-start">
                <div className="bg-white border border-slate-200 rounded-2xl rounded-bl-sm p-3 text-sm">
                  <div className="flex gap-1">
                    <div className="w-2 h-2 bg-slate-400 rounded-full animate-pulse-soft" />
                    <div className="w-2 h-2 bg-slate-400 rounded-full animate-pulse-soft" style={{ animationDelay: '0.2s' }} />
                    <div className="w-2 h-2 bg-slate-400 rounded-full animate-pulse-soft" style={{ animationDelay: '0.4s' }} />
                  </div>
                </div>
              </div>
            )}
          </div>
          <div className="p-3 border-t border-slate-200 bg-white">
            <div className="flex gap-1 mb-2 overflow-x-auto pb-1 scrollbar-hide">
              {quickQuestions.map(q => (
                <button key={q} onClick={() => { setMessages(m => [...m, { role: 'user', text: q }]); setTimeout(() => { setMessages(m => [...m, { role: 'assistant', text: getResponse(q) }]); }, 600); }}
                  className="text-xs px-2 py-1 bg-indigo-50 text-indigo-700 rounded-full whitespace-nowrap hover:bg-indigo-100">{q}</button>
              ))}
            </div>
            <div className="flex gap-2">
              <input type="text" value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && send()} placeholder="Kuch bhi poochein..." className="input-field flex-1 text-sm" />
              <button onClick={send} disabled={!input.trim()} className="btn-primary px-3"><Icon name="send" className="w-4 h-4" /></button>
            </div>
          </div>
        </div>
      )}
    </>
  );
};

/* ============ BUILDER ============ */
const Builder = ({ initialResume, onSave, onExit }) => {
  const [resume, setResume] = useState(initialResume);
  const [step, setStep] = useState(1);
  const [saving, setSaving] = useState(false);
  const [lastSaved, setLastSaved] = useState(null);
  const [showTemplates, setShowTemplates] = useState(false);
  const [showCustomizer, setShowCustomizer] = useState(false);
  const [zoom, setZoom] = useState(1);
  const toast = useToast();
  const template = TEMPLATES.find(t => t.id === resume.templateId) || TEMPLATES[0];

  const saveTimer = useRef(null);
  useEffect(() => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      setSaving(true);
      onSave({ ...resume, updatedAt: new Date().toISOString() });
      setTimeout(() => { setSaving(false); setLastSaved(new Date()); }, 500);
    }, 2000);
    return () => { if (saveTimer.current) clearTimeout(saveTimer.current); };
  }, [resume]);

  const loadSample = () => {
    if (confirm('Sample data load karein? Aapki current information replace ho jayegi.')) {
      setResume({ ...SAMPLE_RESUME, id: resume.id, title: resume.title, templateId: resume.templateId, design: resume.design });
      toast.show('Sample data load ho gaya!', 'success');
    }
  };

  const next = () => { if (step < 10) setStep(step + 1); else downloadPDF(); };
  const back = () => step > 1 && setStep(step - 1);

  const downloadPDF = async () => {
    toast.show('PDF bana rahe hain...', 'info');
    const element = document.getElementById('resume-pdf-export');
    if (!element) { toast.show('PDF nahi ban saki', 'error'); return; }
    try {
      const opt = {
        margin: 0,
        filename: `${resume.personal.firstName || 'resume'}_${resume.personal.lastName || ''}_resume.pdf`.toLowerCase().replace(/\s+/g, '_'),
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff' },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['css', 'legacy'] }
      };
      await html2pdf().set(opt).from(element).save();
      toast.show('PDF download ho gayi! 🎉', 'success');
    } catch (err) {
      console.error('PDF error:', err);
      toast.show('PDF download mein masla hua', 'error');
    }
  };

  const renderStep = () => {
    switch (step) {
      case 1: return <PersonalInfoStep data={resume.personal} onChange={(p) => setResume({ ...resume, personal: p })} />;
      case 2: return <SummaryStep data={resume.summary} onChange={(s) => setResume({ ...resume, summary: s })} />;
      case 3: return <ExperienceStep data={resume.experiences} onChange={(e) => setResume({ ...resume, experiences: e })} />;
      case 4: return <EducationStep data={resume.education} onChange={(e) => setResume({ ...resume, education: e })} />;
      case 5: return <SkillsStep data={resume.skills} onChange={(s) => setResume({ ...resume, skills: s })} />;
      case 6: return <CertificationsStep data={resume.certifications} onChange={(c) => setResume({ ...resume, certifications: c })} />;
      case 7: return <ProjectsStep data={resume.projects} onChange={(p) => setResume({ ...resume, projects: p })} />;
      case 8: return <AdditionalStep data={resume.additional} onChange={(a) => setResume({ ...resume, additional: a })} />;
      case 9: return <JobTargetStep resume={resume} onUpdate={(j) => setResume({ ...resume, jobTarget: j })} />;
      case 10: return <ATSCheckStep resume={resume} />;
      default: return null;
    }
  };

  return (
    <div className="min-h-screen bg-slate-50">
      <div className="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div className="max-w-full mx-auto px-4 py-3 flex items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <button onClick={onExit} className="p-2 hover:bg-slate-100 rounded-lg" title="Back to Home"><Icon name="arrow-left" className="w-5 h-5" /></button>
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center"><Icon name="file-text" className="w-4 h-4 text-white" /></div>
              <input type="text" value={resume.title} onChange={(e) => setResume({ ...resume, title: e.target.value })} className="font-semibold bg-transparent border-none outline-none text-slate-900 w-48" placeholder="Resume Title" />
            </div>
          </div>
          <div className="flex items-center gap-2">
            <div className="hidden md:flex items-center gap-2 text-xs text-slate-500">
              {saving ? (<><Icon name="loader-2" className="w-3 h-3 animate-spin" /> Save ho raha hai...</>) : lastSaved ? (<><Icon name="check" className="w-3 h-3 text-emerald-500" /> Save ho gaya</>) : null}
            </div>
            <Button variant="ghost" size="sm" onClick={loadSample} icon="sparkles">Sample</Button>
            <Button variant="secondary" size="sm" onClick={() => setShowTemplates(!showTemplates)} icon="layout">{showTemplates ? 'Hide Templates' : 'Templates'}</Button>
            <Button variant="primary" size="sm" onClick={downloadPDF} icon="download">Download PDF</Button>
          </div>
        </div>
        <div className="max-w-full mx-auto px-4 pb-3">
          <div className="flex items-center gap-1 overflow-x-auto scrollbar-hide">
            {Array.from({ length: 10 }, (_, i) => i + 1).map(s => (
              <button key={s} onClick={() => setStep(s)} className={`flex-shrink-0 h-1.5 rounded-full transition-all ${s === step ? 'w-12 bg-indigo-600' : s < step ? 'w-6 bg-indigo-300' : 'w-6 bg-slate-200'}`} />
            ))}
          </div>
        </div>
      </div>

      <div className="flex h-[calc(100vh-120px)]">
        <div className="flex-1 overflow-y-auto p-6">
          <div className="max-w-3xl mx-auto">
            {showTemplates ? (
              <div className="space-y-6">
                <TemplateGallery resume={resume} currentTemplateId={resume.templateId}
                  onSelect={(id) => {
                    const t = TEMPLATES.find(x => x.id === id);
                    setResume({ ...resume, templateId: id, design: { ...resume.design, primaryColor: t.defaultPrimary, accentColor: t.defaultAccent, font: t.font, fontClass: t.fontClass, layout: t.layout } });
                    toast.show(`"${t.name}" template select ho gaya!`, 'success');
                  }} />
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  <TemplateCustomizer design={resume.design} template={template} onChange={(d) => setResume({ ...resume, design: d })} />
                  <SectionReorder sections={resume.sections} onChange={(s) => setResume({ ...resume, sections: s })} />
                </div>
              </div>
            ) : (
              <>
                {renderStep()}
                <WizardNav current={step} total={10} onBack={back} onNext={next} onSkip={step > 1 && step < 10 ? next : null} isLast={step === 10} />
              </>
            )}
          </div>
        </div>

        <div className="hidden lg:block w-1/2 bg-slate-100 border-l border-slate-200 overflow-y-auto">
          <div className="sticky top-0 bg-slate-100/80 backdrop-blur px-4 py-3 flex items-center justify-between z-10">
            <h3 className="font-semibold text-slate-900 flex items-center gap-2"><Icon name="eye" className="w-4 h-4" />Live Preview</h3>
            <div className="flex gap-2 items-center">
              <button onClick={() => setZoom(Math.max(0.6, zoom - 0.15))} className="p-1 hover:bg-white rounded"><Icon name="zoom-out" className="w-4 h-4" /></button>
              <span className="text-xs text-slate-500 w-10 text-center">{Math.round(zoom * 100)}%</span>
              <button onClick={() => setZoom(Math.min(1.4, zoom + 0.15))} className="p-1 hover:bg-white rounded"><Icon name="zoom-in" className="w-4 h-4" /></button>
              <button onClick={() => setShowCustomizer(!showCustomizer)} className="p-1.5 hover:bg-white rounded-lg" title="Customize"><Icon name="settings" className="w-4 h-4" /></button>
            </div>
          </div>
          {showCustomizer && (
            <div className="px-4 pb-4 grid grid-cols-1 gap-4">
              <TemplateCustomizer design={resume.design} template={template} onChange={(d) => setResume({ ...resume, design: d })} />
              <SectionReorder sections={resume.sections} onChange={(s) => setResume({ ...resume, sections: s })} />
            </div>
          )}
          <div className="px-8 pb-8">
            <div className="mx-auto bg-white rounded-lg shadow-lg overflow-hidden" style={{ width: `${zoom * 100}%`, maxWidth: '100%' }}>
              <AutoScaledResume resume={resume} templateId={resume.templateId} design={{ ...template, ...resume.design }} />
            </div>
          </div>
        </div>
      </div>

      <div style={{ position: 'absolute', left: '-9999px', top: 0 }}>
        <div id="resume-pdf-export" style={{ width: PAGE_W }}>
          <ResumePreview resume={resume} templateId={resume.templateId} design={{ ...template, ...resume.design }} />
        </div>
      </div>

      <AIAssistant />
    </div>
  );
};

/* ============ APP ============ */
const App = () => {
  const [screen, setScreen] = useState('landing');
  const [resumes, setResumes] = useState([]);
  const [currentResumeId, setCurrentResumeId] = useState(null);

  useEffect(() => {
    try {
      const saved = localStorage.getItem('resumeforge_resumes');
      if (saved) {
        const parsed = JSON.parse(saved);
        const cleaned = parsed.filter(r => !(r.personal?.firstName === 'Sarah' && r.personal?.lastName === 'Johnson'));
        setResumes(cleaned);
        if (cleaned.length !== parsed.length) {
          localStorage.setItem('resumeforge_resumes', JSON.stringify(cleaned));
        }
      }
    } catch (e) { console.error('Load error:', e); }
  }, []);

  const saveResumes = (newResumes) => {
    setResumes(newResumes);
    try { localStorage.setItem('resumeforge_resumes', JSON.stringify(newResumes)); } catch (e) { console.error('Save error:', e); }
  };

  const handleCreateResume = () => {
    const newResume = createEmptyResume();
    saveResumes([newResume, ...resumes]);
    setCurrentResumeId(newResume.id);
    setScreen('builder');
  };
  const handleUseTemplate = (tid) => {
    const t = TEMPLATES.find(x => x.id === tid);
    const r = createEmptyResume();
    r.templateId = tid;
    r.design = { ...r.design, primaryColor: t.defaultPrimary, accentColor: t.defaultAccent, font: t.font, fontClass: t.fontClass, layout: t.layout };
    saveResumes([r, ...resumes]);
    setCurrentResumeId(r.id);
    setScreen('builder');
  };
  const handleEditResume = (id) => { setCurrentResumeId(id); setScreen('builder'); };
  const handleSaveResume = (resume) => saveResumes(resumes.map(r => r.id === resume.id ? resume : r));
  const handleDeleteResume = (id) => saveResumes(resumes.filter(r => r.id !== id));
  const handleDuplicateResume = (resume) => saveResumes([{ ...resume, id: `resume_${Date.now()}`, title: `${resume.title} (Copy)`, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }, ...resumes]);
  const handleExitBuilder = () => { setCurrentResumeId(null); setScreen('landing'); };
  const currentResume = resumes.find(r => r.id === currentResumeId);

  return (
    <ToastProvider>
      {screen === 'landing' && (
        <Landing resumes={resumes} onStart={handleCreateResume} onEditResume={handleEditResume}
          onDeleteResume={handleDeleteResume} onDuplicateResume={handleDuplicateResume} onUseTemplate={handleUseTemplate} />
      )}
      {screen === 'builder' && currentResume && (
        <Builder initialResume={currentResume} onSave={handleSaveResume} onExit={handleExitBuilder} />
      )}
    </ToastProvider>
  );
};
